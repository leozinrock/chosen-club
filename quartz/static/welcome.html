<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chosen Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #080810;
      font-family: 'Inter', sans-serif;
    }

    /* ── Orbes animadas ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      opacity: 0;
      animation: orb-appear 1.2s ease forwards;
    }
    .orb-1 {
      width: 600px; height: 600px;
      top: -200px; left: -150px;
      background: radial-gradient(circle, #C9A84C 0%, #5a3d0a 60%, transparent 100%);
      animation-delay: 0.1s;
      animation-name: orb-appear, orb-float-1;
      animation-duration: 1.2s, 12s;
      animation-timing-function: ease, ease-in-out;
      animation-fill-mode: forwards, none;
      animation-iteration-count: 1, infinite;
    }
    .orb-2 {
      width: 500px; height: 500px;
      bottom: -150px; right: -100px;
      background: radial-gradient(circle, #F0D070 0%, #8B6914 50%, transparent 100%);
      animation-delay: 0.3s;
      animation-name: orb-appear, orb-float-2;
      animation-duration: 1.2s, 15s;
      animation-timing-function: ease, ease-in-out;
      animation-fill-mode: forwards, none;
      animation-iteration-count: 1, infinite;
    }
    .orb-3 {
      width: 350px; height: 350px;
      top: 40%; left: 55%;
      background: radial-gradient(circle, #E8C97A 0%, #4a2e07 50%, transparent 100%);
      opacity: 0.08;
      animation-delay: 0.5s;
      animation-name: orb-appear-dim, orb-float-3;
      animation-duration: 1.2s, 10s;
      animation-timing-function: ease, ease-in-out;
      animation-fill-mode: forwards, none;
      animation-iteration-count: 1, infinite;
    }

    @keyframes orb-appear      { to { opacity: 0.15; } }
    @keyframes orb-appear-dim  { to { opacity: 0.08; } }
    @keyframes orb-float-1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%       { transform: translate(40px, -50px) scale(1.08); }
    }
    @keyframes orb-float-2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%       { transform: translate(-50px, 30px) scale(1.06); }
    }
    @keyframes orb-float-3 {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(25px, 40px); }
    }

    /* ── Linha horizontal decorativa ── */
    .line {
      position: fixed;
      top: 50%; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(201,168,76,0.15) 25%,
        rgba(201,168,76,0.15) 75%,
        transparent 100%);
      pointer-events: none;
    }

    /* ── Conteúdo central ── */
    .stage {
      position: relative;
      z-index: 10;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 1.1rem;
      border-radius: 50px;
      border: 1px solid rgba(201,168,76,0.38);
      background: rgba(201,168,76,0.08);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #C9A84C;
      opacity: 0;
      transform: translateY(10px);
      animation: item-in 0.6s 0.4s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    /* Título */
    .title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3.8rem, 12vw, 6.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.0;
      background: linear-gradient(135deg, #C9A84C 0%, #F0D070 40%, #E8C97A 65%, #D4AF37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 1rem 0 0.9rem;
      opacity: 0;
      transform: translateY(24px) scale(0.97);
      animation: item-in 0.75s 0.55s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    /* Tagline */
    .tagline {
      font-size: clamp(0.9rem, 2.2vw, 1.05rem);
      color: rgba(255,255,255,0.4);
      line-height: 1.65;
      max-width: 400px;
      opacity: 0;
      transform: translateY(14px);
      animation: item-in 0.6s 0.75s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    /* Botão */
    .enter-btn {
      margin-top: 2.4rem;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.85rem 2.2rem;
      border-radius: 50px;
      border: 1px solid rgba(201,168,76,0.45);
      background: linear-gradient(135deg, #C9A84C 0%, #F0D070 50%, #D4AF37 100%);
      color: #0f0e09;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.01em;
      cursor: pointer;
      opacity: 0;
      transform: translateY(14px);
      animation:
        item-in 0.6s 0.95s cubic-bezier(0.16,1,0.3,1) forwards,
        btn-pulse 2.8s 2s ease-in-out infinite;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .enter-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 10px 36px rgba(201,168,76,0.6);
    }
    .enter-btn:active { transform: scale(0.97); }
    .arrow { font-style: normal; transition: transform 0.2s ease; }
    .enter-btn:hover .arrow { transform: translateX(4px); }

    /* Barra de progresso */
    .timer-track {
      width: 160px;
      height: 2px;
      background: rgba(201,168,76,0.12);
      border-radius: 50px;
      margin-top: 1.6rem;
      overflow: hidden;
      opacity: 0;
      animation: item-in 0.4s 1.1s ease forwards;
    }
    .timer-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #C9A84C, #F0D070);
      border-radius: 50px;
    }

    .hint {
      font-size: 0.67rem;
      color: rgba(255,255,255,0.18);
      margin-top: 0.65rem;
      letter-spacing: 0.06em;
      opacity: 0;
      animation: item-in 0.4s 1.2s ease forwards;
    }

    /* ── Animações genéricas ── */
    @keyframes item-in {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes btn-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.35), 0 6px 28px rgba(201,168,76,0.28); }
      50%       { box-shadow: 0 0 0 10px rgba(201,168,76,0), 0 6px 28px rgba(201,168,76,0.5); }
    }

    /* ── Saída ── */
    body.exit {
      animation: page-exit 0.7s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    @keyframes page-exit {
      to { opacity: 0; transform: scale(1.04); }
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .title { font-size: 3.2rem; }
      .enter-btn { padding: 0.75rem 1.8rem; font-size: 0.92rem; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="line"></div>

  <div class="stage">
    <div class="badge">✦ Networking Premium</div>
    <h1 class="title">Chosen Club</h1>
    <p class="tagline">Conectando profissionais que criam,<br>constroem e transformam.</p>
    <button class="enter-btn" id="enterBtn">
      Entrar na rede <span class="arrow">→</span>
    </button>
    <div class="timer-track">
      <div class="timer-fill" id="timerFill"></div>
    </div>
    <p class="hint">Acesso automático em 5 segundos</p>
  </div>

  <script>
    var DURATION = 5000;
    var fill = document.getElementById('timerFill');
    var btn  = document.getElementById('enterBtn');
    var dest = '../';  // sobe de /static/ para raiz do site

    // Se já visitou nesta sessão, vai direto pro site
    if (sessionStorage.getItem('cc-splash-shown')) {
      location.replace(dest);
    }

    // Inicia barra de progresso
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        fill.style.transition = 'width ' + DURATION + 'ms linear';
        fill.style.width = '100%';
      });
    });

    function enter() {
      sessionStorage.setItem('cc-splash-shown', '1');
      document.body.classList.add('exit');
      setTimeout(function () { location.replace(dest); }, 650);
    }

    btn.addEventListener('click', enter);
    setTimeout(enter, DURATION);
  </script>
</body>
</html>
